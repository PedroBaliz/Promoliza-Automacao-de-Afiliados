services:
  promoliza-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: promoliza:latest
    container_name: promoliza_app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    ports:
      - "3001:3000"
    volumes:
      # Histórico de links (posted-products.json) e sessão do WhatsApp (whatsapp-session/).
      # Sem este volume, recriar o container republica ofertas e pede o QR Code de novo.
      - promoliza_data:/app/.local
    # Permite o login interativo do Telegram via `docker attach` quando
    # TELEGRAM_SOURCE_SESSION ainda estiver vazio.
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  promoliza_data:
    name: promoliza_data
